<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deals - ShopHub</title>
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="top-bar">
        <div class="container-fluid">
            <div class="top-bar-content">
                <div class="top-left">
                    <i class="fas fa-phone-alt"></i> +880 1760033212
                    <i class="fas fa-envelope"></i> <a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="ef9c9a9f9f809d9baf9c87809f879a8dc18c8082">emon212.cse@gmail.com</a>
                </div>
                <div class="top-right">
                    <a href="#"><i class="fab fa-facebook-f"></i></a>
                    <a href="#"><i class="fab fa-instagram"></i></a>
                    <a href="#"><i class="fab fa-twitter"></i></a>
                </div>
            </div>
        </div>
    </div>

    <header class="header">
        <div class="container-fluid">
            <nav class="navbar">
                <div class="logo">
                    <i class="fas fa-shopping-bag"></i>
                    <span>Shop<strong>Hub</strong></span>
                </div>
                <div class="nav-center">
                    <ul class="nav-menu">
                        <li><a href="../index.html">Home</a></li>
                        <li><a href="shop.html">Shop</a></li>
                        <li><a href="deals.html" class="active">Deals</a></li>
                        <li><a href="about.html">About</a></li>
                        <li><a href="contact.html">Contact</a></li>
                    </ul>
                </div>
                <div class="nav-right">
                    <button class="icon-btn" onclick="toggleCart()">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="badge" id="cartBadge">0</span>
                    </button>
                </div>
            </nav>
        </div>
    </header>

    <section style="background: linear-gradient(135deg, #f093fb, #f5576c); padding: 80px 0; text-align: center; color: white;">
        <div class="container-fluid">
            <h1 style="font-size: 56px; font-weight: 800; margin-bottom: 15px;">🔥 Hot Deals & Offers</h1>
            <p style="font-size: 20px; opacity: 0.95;">Limited time offers - Grab them before they're gone!</p>
        </div>
    </section>

    <section style="padding: 60px 0; background: var(--bg-light);">
        <div class="container-fluid">
            <div class="products-grid" id="dealsContainer"></div>
        </div>
    </section>

    <footer class="footer">
        <div class="container-fluid">
            <div class="footer-bottom">
                <p>&copy; 2024 ShopHub. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h3>Cart</h3>
            <button class="close-cart" onclick="toggleCart()"><i class="fas fa-times"></i></button>
        </div>
        <div class="cart-items" id="cartItems"></div>
    </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script src="../script.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const deals = products.filter(p => p.badge === 'sale' || p.oldPrice);
            document.getElementById('dealsContainer').innerHTML = deals.map(product => `
                <div class="product-card">
                    <span class="product-badge sale">SALE</span>
                    <div class="product-image">
                        <img src="${product.image}" alt="${product.name}">
                    </div>
                    <div class="product-info">
                        <h3>${product.name}</h3>
                        <div class="product-price">
                            <span class="current-price">$${product.price}</span>
                            ${product.oldPrice ? `<span class="old-price">$${product.oldPrice}</span>` : ''}
                        </div>
                        <button onclick="addToCart(${product.id})" class="add-to-cart">Add to Cart</button>
                    </div>
                </div>
            `).join('');
        });
    </script>
</body>
</html>
