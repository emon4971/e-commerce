<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - ShopHub</title>
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>ðŸ›’</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="top-bar">
        <div class="container-fluid">
            <div class="top-bar-content">
                <div class="top-left">
                    <i class="fas fa-phone-alt"></i> +880 1760033212
                </div>
                <div class="top-right">
                    <span>ðŸ”’ Secure Checkout</span>
                </div>
            </div>
        </div>
    </div>

    <header class="header">
        <div class="container-fluid">
            <nav class="navbar">
                <div class="logo">
                    <i class="fas fa-shopping-bag"></i>
                    <span>Shop<strong>Hub</strong></span>
                </div>
            </nav>
        </div>
    </header>

    <section style="padding: 60px 0; background: var(--bg-light);">
        <div class="container-fluid">
            <div style="max-width: 1200px; margin: 0 auto;">
                
                <div style="display: flex; gap: 15px; margin-bottom: 40px; justify-content: center;">
                    <div style="flex: 1; text-align: center; padding: 20px; background: var(--primary-color); color: white; border-radius: 10px;">
                        <i class="fas fa-shopping-cart" style="font-size: 24px; margin-bottom: 10px;"></i>
                        <p style="font-weight: 600;">1. Cart</p>
                    </div>
                    <div style="flex: 1; text-align: center; padding: 20px; background: var(--primary-color); color: white; border-radius: 10px;">
                        <i class="fas fa-credit-card" style="font-size: 24px; margin-bottom: 10px;"></i>
                        <p style="font-weight: 600;">2. Checkout</p>
                    </div>
                    <div style="flex: 1; text-align: center; padding: 20px; background: var(--bg-white); border-radius: 10px;">
                        <i class="fas fa-check-circle" style="font-size: 24px; margin-bottom: 10px;"></i>
                        <p style="font-weight: 600;">3. Complete</p>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 400px; gap: 40px;">
                    
                    <div>
                        <div style="background: var(--bg-white); border-radius: 15px; padding: 30px; box-shadow: var(--shadow-sm); margin-bottom: 30px;">
                            <h2 style="font-size: 24px; margin-bottom: 25px;">Billing Information</h2>
                            <form id="checkoutForm" style="display: grid; gap: 20px;">
                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                                    <div>
                                        <label style="display: block; margin-bottom: 8px; font-weight: 500;">First Name</label>
                                        <input type="text" required style="width: 100%; padding: 12px; border: 2px solid var(--border-color); border-radius: 8px;">
                                    </div>
                                    <div>
                                        <label style="display: block; margin-bottom: 8px; font-weight: 500;">Last Name</label>
                                        <input type="text" required style="width: 100%; padding: 12px; border: 2px solid var(--border-color); border-radius: 8px;">
                                    </div>
                                </div>
                                
                                <div>
                                    <label style="display: block; margin-bottom: 8px; font-weight: 500;">Email</label>
                                    <input type="email" required style="width: 100%; padding: 12px; border: 2px solid var(--border-color); border-radius: 8px;">
                                </div>
                                
                                <div>
                                    <label style="display: block; margin-bottom: 8px; font-weight: 500;">Phone</label>
                                    <input type="tel" required style="width: 100%; padding: 12px; border: 2px solid var(--border-color); border-radius: 8px;">
                                </div>
                                
                                <div>
                                    <label style="display: block; margin-bottom: 8px; font-weight: 500;">Address</label>
                                    <input type="text" required style="width: 100%; padding: 12px; border: 2px solid var(--border-color); border-radius: 8px;">
                                </div>
                                
                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                                    <div>
                                        <label style="display: block; margin-bottom: 8px; font-weight: 500;">City</label>
                                        <input type="text" required style="width: 100%; padding: 12px; border: 2px solid var(--border-color); border-radius: 8px;">
                                    </div>
                                    <div>
                                        <label style="display: block; margin-bottom: 8px; font-weight: 500;">Postal Code</label>
                                        <input type="text" required style="width: 100%; padding: 12px; border: 2px solid var(--border-color); border-radius: 8px;">
                                    </div>
                                </div>
                            </form>
                        </div>

                        <div style="background: var(--bg-white); border-radius: 15px; padding: 30px; box-shadow: var(--shadow-sm);">
                            <h2 style="font-size: 24px; margin-bottom: 25px;">Payment Method</h2>
                            <div style="display: flex; flex-direction: column; gap: 15px;">
                                <label style="padding: 20px; border: 2px solid var(--border-color); border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 15px;">
                                    <input type="radio" name="payment" value="card" checked>
                                    <i class="fas fa-credit-card" style="font-size: 24px; color: var(--primary-color);"></i>
                                    <span style="font-weight: 600;">Credit / Debit Card</span>
                                </label>
                                <label style="padding: 20px; border: 2px solid var(--border-color); border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 15px;">
                                    <input type="radio" name="payment" value="cod">
                                    <i class="fas fa-money-bill-wave" style="font-size: 24px; color: var(--success-color);"></i>
                                    <span style="font-weight: 600;">Cash on Delivery</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div>
                        <div style="background: var(--bg-white); border-radius: 15px; padding: 30px; box-shadow: var(--shadow-sm); position: sticky; top: 100px;">
                            <h2 style="font-size: 24px; margin-bottom: 25px;">Order Summary</h2>
                            
                            <div id="checkoutItems" style="max-height: 300px; overflow-y: auto; margin-bottom: 20px;"></div>
                            
                            <div style="border-top: 2px solid var(--border-color); padding-top: 20px;">
                                <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                                    <span style="color: var(--text-light);">Subtotal:</span>
                                    <span id="checkoutSubtotal" style="font-weight: 600;">$0.00</span>
                                </div>
                                
                                <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                                    <span style="color: var(--text-light);">Shipping:</span>
                                    <span style="font-weight: 600; color: var(--success-color);">FREE</span>
                                </div>
                                
                                <div style="display: flex; justify-content: space-between; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 2px solid var(--border-color);">
                                    <span style="color: var(--text-light);">Tax:</span>
                                    <span id="checkoutTax" style="font-weight: 600;">$0.00</span>
                                </div>
                                
                                <div style="display: flex; justify-content: space-between; margin-bottom: 30px; font-size: 22px;">
                                    <span style="font-weight: 700;">Total:</span>
                                    <span id="checkoutTotal" style="font-weight: 700; color: var(--primary-color);">$0.00</span>
                                </div>
                                
                                <button onclick="placeOrder()" class="btn btn-primary btn-block" style="font-size: 18px; padding: 15px;">
                                    <i class="fas fa-lock"></i> Place Order
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container-fluid">
            <div class="footer-bottom">
                <p>&copy; 2024 ShopHub. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="../script.js"></script>
    <script>
        function renderCheckoutItems() {
            const container = document.getElementById('checkoutItems');
            
            container.innerHTML = cart.map(item => `
                <div style="display: flex; gap: 15px; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color);">
                    <img src="${item.image}" alt="${item.name}" style="width: 60px; height: 60px; object-fit: cover; border-radius: 8px;">
                    <div style="flex: 1;">
                        <h4 style="font-size: 14px; margin-bottom: 5px;">${item.name}</h4>
                        <p style="font-size: 13px; color: var(--text-light);">Qty: ${item.quantity}</p>
                    </div>
                    <div style="text-align: right;">
                        <p style="font-weight: 600; color: var(--primary-color);">$${(item.price * item.quantity).toFixed(2)}</p>
                    </div>
                </div>
            `).join('');
            
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const tax = subtotal * 0.1;
            const total = subtotal + tax;
            
            document.getElementById('checkoutSubtotal').textContent = '$' + subtotal.toFixed(2);
            document.getElementById('checkoutTax').textContent = '$' + tax.toFixed(2);
            document.getElementById('checkoutTotal').textContent = '$' + total.toFixed(2);
        }

        function placeOrder() {
            const form = document.getElementById('checkoutForm');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }
            
            // Generate order ID
            const orderId = 'ORD' + Date.now().toString().slice(-8);
            
            // Calculate totals
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const tax = subtotal * 0.1;
            const total = (subtotal + tax).toFixed(2);
            
            // Create order object
            const order = {
                orderId: orderId,
                date: new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }),
                items: cart.map(item => ({
                    id: item.id,
                    name: item.name,
                    price: item.price,
                    quantity: item.quantity,
                    image: item.image
                })),
                total: total,
                status: 'Processing'
            };
            
            // Save order to localStorage
            const orders = JSON.parse(localStorage.getItem('orders') || '[]');
            orders.push(order);
            localStorage.setItem('orders', JSON.stringify(orders));
            
            // Clear cart
            cart = [];
            saveCartToStorage();
            
            alert('Order placed successfully! Order ID: #' + orderId);
            window.location.href = '../index.html';
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (cart.length === 0) {
                alert('Your cart is empty!');
                window.location.href = 'shop.html';
                return;
            }
            renderCheckoutItems();
        });
    </script>
</body>
</html>
