    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>

                </div>
                <div class="top-right">
                    <a href="#"><i class="fab fa-facebook-f"></i></a>
                    <a href="#"><i class="fab fa-instagram"></i></a>
                    <a href="#"><i class="fab fa-twitter"></i></a>
                </div>
            </div>
        </div>
    </div>

    <header class="header">
        <div class="container-fluid">
            <nav class="navbar">
                <div class="logo">
                    <i class="fas fa-shopping-bag"></i>
                    <span>Shop<strong>Hub</strong></span>
                </div>
                <div class="nav-center">
                    <ul class="nav-menu">
                        <li><a href="../index.html">Home</a></li>
                        <li><a href="shop.html">Shop</a></li>
                        <li><a href="deals.html">Deals</a></li>
                        <li><a href="about.html">About</a></li>

                    </ul>
                </div>
                <div class="nav-right">
                    <button class="icon-btn" onclick="toggleCart()">
                        <i class="fas fa-shopping-cart"></i>

                    </button>

            </nav>
        </div>
    </header>

    <section style="background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); padding: 60px 0; text-align: center; color: white;">
        <div class="container-fluid">
            <h1 style="font-size: 48px; font-weight: 700;">Shopping Cart</h1>
        </div>
    </section>

    <section style="padding: 60px 0; background: var(--bg-light);">
        <div class="container-fluid">
            <div style="display: grid; grid-template-columns: 1fr 400px; gap: 40px;">
                
                <div>
                    <div style="background: var(--bg-white); border-radius: 15px; padding: 30px; box-shadow: var(--shadow-sm);">
                        <h2 style="font-size: 24px; margin-bottom: 25px;">Cart Items</h2>
                        <div id="cartPageItems"></div>
                    </div>
                </div>

                <div>
                    <div style="background: var(--bg-white); border-radius: 15px; padding: 30px; box-shadow: var(--shadow-sm); position: sticky; top: 100px;">
                        <h2 style="font-size: 24px; margin-bottom: 25px;">Order Summary</h2>
                        
                        <div style="display: flex; justify-content: space-between; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color);">
                            <span style="color: var(--text-light);">Subtotal:</span>
                            <span id="subtotalAmount" style="font-weight: 600;">$0.00</span>
                        </div>
                        
                        <div style="display: flex; justify-content: space-between; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color);">
                            <span style="color: var(--text-light);">Shipping:</span>
                            <span style="font-weight: 600; color: var(--success-color);">FREE</span>
                        </div>
                        
                        <div style="display: flex; justify-content: space-between; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color);">
                            <span style="color: var(--text-light);">Tax:</span>
                            <span id="taxAmount" style="font-weight: 600;">$0.00</span>
                        </div>
                        
                        <div style="display: flex; justify-content: space-between; margin-bottom: 30px; font-size: 20px;">
                            <span style="font-weight: 700;">Total:</span>
                            <span id="totalAmount" style="font-weight: 700; color: var(--primary-color);">$0.00</span>
                        </div>
                        
                        <a href="checkout.html" class="btn btn-primary btn-block" style="margin-bottom: 15px;">
                            Proceed to Checkout
                        </a>
                        
                        <a href="shop.html" class="btn btn-outline btn-block">
                            Continue Shopping
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container-fluid">
            <div class="footer-bottom">
                <p>&copy; 2024 ShopHub. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script src="../script.js"></script>
    <script>
        function renderCartPage() {
            const container = document.getElementById('cartPageItems');
            
            if (cart.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 60px 20px;">
                        <i class="fas fa-shopping-cart" style="font-size: 80px; color: var(--text-light); margin-bottom: 20px;"></i>
                        <h3 style="margin-bottom: 10px;">Your cart is empty</h3>
                        <p style="color: var(--text-light); margin-bottom: 30px;">Add some products to get started!</p>
                        <a href="shop.html" class="btn btn-primary">Start Shopping</a>
                    </div>
                `;
                updateCartSummary();
                return;
            }
            
            container.innerHTML = cart.map(item => `
                <div style="display: flex; gap: 20px; padding: 20px; border-bottom: 1px solid var(--border-color); align-items: center;">
                    <img src="${item.image}" alt="${item.name}" style="width: 100px; height: 100px; object-fit: cover; border-radius: 10px;">
                    
                    <div style="flex: 1;">
                        <h3 style="font-size: 18px; margin-bottom: 5px;">${item.name}</h3>
                        <p style="color: var(--primary-color); font-weight: 700; font-size: 20px;">$${item.price}</p>
                    </div>
                    
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <button onclick="updateQuantity(${item.id}, -1)" style="width: 35px; height: 35px; background: var(--bg-light); border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                            <i class="fas fa-minus"></i>
                        </button>
                        <span style="font-weight: 600; font-size: 18px; min-width: 30px; text-align: center;">${item.quantity}</span>
                        <button onclick="updateQuantity(${item.id}, 1)" style="width: 35px; height: 35px; background: var(--bg-light); border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                    
                    <div style="text-align: right;">
                        <p style="font-weight: 700; font-size: 20px; color: var(--primary-color); margin-bottom: 10px;">
                            $${(item.price * item.quantity).toFixed(2)}
                        </p>
                        <button onclick="removeFromCart(${item.id}); renderCartPage();" style="color: var(--danger-color); font-size: 20px; cursor: pointer;">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');
            
            updateCartSummary();
        }

        function updateCartSummary() {
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const tax = subtotal * 0.1;
            const total = subtotal + tax;
            
            document.getElementById('subtotalAmount').textContent = '$' + subtotal.toFixed(2);
            document.getElementById('taxAmount').textContent = '$' + tax.toFixed(2);
                    document.getElementById('totalAmount').textContent = '$' + total.toFixed(2);
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderCartPage();
        });
    </script>
</body>
</html>
